[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haruka-userbot"
version = "3.2.4"
description = "Haruka — advanced, independent Telegram userbot with full compatibility for Hikka/Heroku/FTG/GeekTG modules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPLv3" }
authors = [{ name = "Haruka contributors" }]
keywords = ["telegram", "userbot", "haruka", "hikka", "heroku"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "telethon>=1.44.0,<2.0.0",
    "cryptg",
    "aiogram==3.26.0",
    "aiohttp==3.11.18",
    "aiohttp_jinja2==1.5",
    "Jinja2==3.0.3",
    "pydantic-core>=2.27.2",
    "pydantic>=2.10.4",
    "gitpython==3.1.2",
    "deep-translator",
    "meval==2.5",
    "requests>=2.27.1",
    "certifi",
    "grapheme==0.6.0",
    "emoji==2.1.0",
    "psutil>=6.0.0",
    "ruamel.yaml>=0.17.21",
    "orjson",
    "Pillow",
]

[project.optional-dependencies]
extra = [
    "moviepy",
    "python-ffmpeg",
    "ffmpeg",
    "bs4",
    "uvloop; platform_system != 'Windows'",
]

[project.urls]
Homepage = "https://github.com/fuckramochka/haruka"

[tool.setuptools.packages.find]
include = ["haruka*"]

[tool.setuptools.package-data]
haruka = [
    "langpacks/*.yml",
    "../web-resources/**/*",
    "../assets/*",
]
