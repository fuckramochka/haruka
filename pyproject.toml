[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haruka"
version = "2.0.0"
description = "Engine-first runtime and SDK for Telegram userbots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "fuxckramochka" }]
keywords = ["telegram", "userbot", "kurigram", "mtproto", "framework", "engine"]

# Core runtime dependencies. Keep in sync with requirements.txt —
# both engines (kurigram + herokutl) and everything the code imports.
dependencies = [
    "kurigram==2.2.23",
    "heroku-tl-new==2.0.0",
    "TgCrypto-pyrofork",
    "pyaes",
    "rsa==4.9",
    "aiogram==3.26.0",
    "aiohttp==3.11.18",
    "aiohttp_jinja2==1.5",
    "Jinja2==3.1.4",
    "aiosqlite==0.20.0",
    "cryptography==43.0.3",
    "python-dotenv==1.0.1",
    "ruamel.yaml==0.17.21",
    "aiofile==3.8.1",
    "aiofiles==24.1.0",
    "orjson",
    "psutil==6.1.0",
    "GitPython==3.1.43",
    "pydantic>=2.10.4,<2.11",
    "pydantic-core>=2.27.2",
    "requests>=2.32.3",
    "certifi>=2024.8.30",
    "grapheme==0.6.0",
    "emoji==2.1.0",
    "meval==2.5",
    "deep-translator",
    "qrcode[pil]==8.0",
    "Pillow>=10.4.0",
    "werkzeug>=2.2.2",
    "bs4==0.0.2",
]

[project.optional-dependencies]
# Faster MTProto crypto (already a core dep; kept for explicit installs).
fast = ["TgCrypto-pyrofork"]
# Extra media helpers.
media = ["Pillow>=10.4.0"]
# Web/QR onboarding.
web = []
# Everything.
full = ["TgCrypto-pyrofork", "Pillow>=10.4.0"]
# Development.
dev = ["ruff==0.7.3", "pytest==8.3.3", "pytest-asyncio==0.24.0"]

[project.scripts]
haruka = "haruka.__main__:run"

[project.urls]
Homepage = "https://github.com/fuxckramochka/haruka"
Repository = "https://github.com/fuxckramochka/haruka"
Documentation = "https://github.com/fuxckramochka/haruka/tree/main/docs"
Issues = "https://github.com/fuxckramochka/haruka/issues"
Changelog = "https://github.com/fuxckramochka/haruka/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["haruka"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
